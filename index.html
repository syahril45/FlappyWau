<!DOCTYPE html>
<html>
<head>
    <title>Flappy Wau</title>
    <script src="https://cjrtnc.leaningtech.com/3.0/loader.js"></script>
</head>
<body style="margin:0; background-color:black; color:white; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; overflow:hidden;">

    <div id="loading-message">
        <h2>🎮 Loading Flappy Wau...</h2>
        <p>Please wait, downloading game assets (37MB)...</p>
    </div>

    <script>
        async function startGame() {
            try {
                // 1. Initialize the engine
                await cheerpjInit();
                
                // 2. Hide the loading message once ready
                document.getElementById('loading-message').style.display = 'none';
                
                // 3. Create the game screen (adjust width/height if needed)
                cheerpjCreateDisplay(800, 600);
                
                // 4. Run your JAR file
                await cheerpjRunJar("/app/SULAM");
            } catch (error) {
                console.error("Error loading game:", error);
            }
        }

        // Start the process
        startGame();
    </script>
</body>
</html>
