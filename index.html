<script>
    async function initGame() {
        const statusText = document.getElementById('status');
        
        // 1. Wait until 'cheerpjInit' exists in the browser's memory
        if (typeof cheerpjInit === 'undefined') {
            console.log("Engine script not ready yet, retrying...");
            setTimeout(initGame, 500); // Check again in half a second
            return;
        }

        try {
            statusText.innerText = "Initializing Engine (Step 1/2)...";
            await cheerpjInit();
            
            statusText.innerText = "Loading Game (Step 2/2)...";
            cheerpjCreateDisplay(800, 600);
            
            // This matches your successfully downloaded file
            await cheerpjRunJar("/app/SULAM.jar");
            
            document.getElementById('loading-message').style.display = 'none';
        } catch (err) {
            console.error(err);
            statusText.innerText = "Execution Error: " + err.message;
        }
    }

    // Start the checking process
    initGame();
</script>
