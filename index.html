<!DOCTYPE html>
<html>
<head>
    <title>Flappy Wau</title>
    <script src="https://cjrtnc.leaningtech.com/3.0/loader.js"></script>
</head>

<body style="
    margin:0;
    background-color:black;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    font-family:sans-serif;
">

<div id="loading-message" style="text-align:center;">
    <h2>🎮 Flappy Wau</h2>
    <p id="status">Loading Engine...</p>
</div>

<script>
async function initGame() {
    const statusText = document.getElementById("status");

    if (typeof cheerpjInit === "undefined") {
        statusText.innerText = "Waiting for CheerpJ...";
        setTimeout(initGame, 500);
        return;
    }

    try {
        statusText.innerText = "Initializing Java Engine...";
        await cheerpjInit();

        statusText.innerText = "Creating Game Window...";
        cheerpjCreateDisplay(800, 600);

        statusText.innerText = "Launching Game...";
        await cheerpjRunJar("SULAM.jar");

        document.getElementById("loading-message").style.display = "none";
    } catch (e) {
        console.error(e);
        statusText.innerText = "Error: " + e.message;
    }
}

initGame();
</script>

</body>
</html>
