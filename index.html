<!DOCTYPE html>
<html>
<head>
    <title>Flappy Wau</title>
    <link rel="preload" href="SULAM.jar" as="fetch" crossorigin>
    
    <script src="https://cjrtnc.leaningtech.com/3.0/loader.js"></script>
</head>
<body style="margin:0; background-color:black; color:white; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; overflow:hidden; font-family:sans-serif;">

    <div id="loading-message">
        <h2>🎮 Loading Flappy Wau...</h2>
        <p id="status">Waiting for engine...</p>
        <p>Pre-loading 37MB game assets to save time...</p>
    </div>

    <script>
        async function startGame() {
            // Check if engine is ready
            if (typeof cheerpjInit === 'undefined') {
                document.getElementById('status').innerText = "Engine script still downloading...";
                setTimeout(startGame, 500);
                return;
            }

            try {
                document.getElementById('status').innerText = "Engine found! Initializing game...";
                await cheerpjInit();
                
                document.getElementById('loading-message').style.display = 'none';
                
                // Matches your GitHub filename exactly
                cheerpjCreateDisplay(800, 600);
                await cheerpjRunJar("/app/SULAM.jar");
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('status').innerText = "Error: " + error.message;
            }
        }

        startGame();
    </script>
</body>
</html>
