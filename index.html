<script>
    async function startWhenReady() {
        const statusText = document.getElementById('status');
        
        // 1. Check if the engine is ready. If not, wait and try again.
        if (typeof cheerpjInit === 'undefined') {
            console.log("CheerpJ not ready yet... retrying in 500ms");
            setTimeout(startWhenReady, 500); 
            return;
        }

        try {
            // 2. Start the engine
            statusText.innerText = "Initializing Engine...";
            await cheerpjInit();
            
            // 3. Setup the game display
            statusText.innerText = "Launching Flappy Wau...";
            cheerpjCreateDisplay(800, 600);
            
            // 4. Run your JAR file (Matches your 16.7MB download)
            await cheerpjRunJar("/app/SULAM");
            
            // Hide loading message
            document.getElementById('loading-message').style.display = 'none';
        } catch (err) {
            console.error("Startup Error:", err);
            statusText.innerText = "Error: " + err.message;
        }
    }

    // Start the check
    startWhenReady();
</script>
